{% extends "base.html" %}

{% block title %}動畫新番資訊站{% endblock %}

{% block head %}
<meta name="description" content="快速查詢動畫資料">
{% endblock %}

{% block body %}
<div id="app-config"
     hidden
     data-default-year="{{ selected_year }}"
     data-default-season="{{ selected_season }}"
     data-available-data="{{ available_data_json }}"
     data-build-version="{{ build_version }}"
     data-data-version="{{ data_version }}"
     data-quarter-versions="{{ quarter_versions_json }}"
     data-official-story-sources="{{ official_story_sources_json }}"
     data-reviewed-broadcast-sources="{{ reviewed_broadcast_sources_json }}"></div>
<div x-data="animeApp" x-init="initApp" class="app-wrapper">

    <header class="site-header">
        <div class="container header-container">
            <div class="logo-area">
                <h1 class="logo-text">📺 動畫新番資訊站</h1>
            </div>
        </div>
    </header>

    <div class="container main-layout">
        <aside class="control-panel">
            <div class="panel-inner">
                <h3 class="panel-title"><i class="fas fa-filter"></i> 篩選條件</h3>
                
                <div class="form-group">
                    <label for="searchInput" class="form-label">關鍵字搜尋</label>
                    <div class="input-icon-wrapper">
                        <input type="text" id="searchInput" class="form-control" x-model="searchKeyword" @input="loadData()" placeholder="搜尋全部季度的名稱、原名或簡介" aria-describedby="searchScope">
                    </div>
                    <small id="searchScope" class="search-scope">關鍵字會搜尋全部年份與季度；清空後回到所選季度。可搭配放送日及播出狀態篩選。</small>
                </div>

                <div class="form-group">
                    <label for="yearSelect" class="form-label">年份</label>
                    <select id="yearSelect" class="form-select" x-model="year" @change="changeYear" :disabled="searchKeyword.trim().length > 0">
                        <template x-for="y in years" :key="y">
                            <option :value="y" x-text="y + ' 年'"></option>
                        </template>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="seasonSelect" class="form-label">季節</label>
                    <select id="seasonSelect" class="form-select" x-model="season" @change="loadData()" :disabled="searchKeyword.trim().length > 0">
                        <template x-for="s in seasons" :key="s">
                            <option :value="s" x-text="seasonLabel(s)"></option>
                        </template>
                    </select>
                </div>

                <div class="form-group">
                    <label for="weekdaySelect" class="form-label">每週放送</label>
                    <select id="weekdaySelect" class="form-select" x-model="filterDay" @change="saveFilterDay">
                        <option value="全部">全部顯示</option>
                        <option value="一">週一</option>
                        <option value="二">週二</option>
                        <option value="三">週三</option>
                        <option value="四">週四</option>
                        <option value="五">週五</option>
                        <option value="六">週六</option>
                        <option value="日">週日</option>
                        <option value="一至五">週一至五（多日）</option>
                        <option value="不定期公開">不定期公開</option>
                        <option value="無首播日期">播出日待確認</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="airingStatusSelect" class="form-label">播出狀態</label>
                    <select id="airingStatusSelect" class="form-select" x-model="filterStatus">
                        <option value="全部">全部顯示</option>
                        <option value="airing">播出中</option>
                        <option value="finished">本季已播畢</option>
                        <option value="not_yet_aired">尚未播出</option>
                        <option value="unknown">狀態待確認</option>
                        <option value="paused">暫停播出</option>
                        <option value="cancelled">取消播出</option>
                    </select>
                </div>

                <div x-show="storageWarning" class="status-box" role="status" aria-live="polite" style="padding: 12px; margin-bottom: 16px; font-size: 0.9rem; text-align: left;">
                    <span x-text="storageWarning"></span>
                    <button type="button" class="btn-add" style="margin-top: 10px; width: 100%;" @click="dismissStorageWarning()">知道了</button>
                </div>

                <div class="share-widget">
                    <h3 class="panel-title small"><i class="fas fa-list"></i> 分享清單</h3>
                    <div id="shareListContainer">
                        <template x-if="shareList.length === 0">
                            <div class="empty-state" style="color:#888; text-align:center; padding:20px;">尚無內容</div>
                        </template>
                        
                        <template x-for="(item, index) in shareList" :key="index">
                            <div class="share-item">
                                <img :src="item.img" loading="lazy" decoding="async" alt="">
                                <div class="share-item-info">
                                    <div class="share-item-title" x-text="item.name"></div>
                                    <div x-text="item.date + ' ' + item.time"></div>
                                </div>
                                <div class="share-remove" @click="removeFromShare(index)" title="移除">
                                    <i class="fas fa-trash-alt"></i>
                                </div>
                            </div>
                        </template>
                    </div>
                    <button id="copyButton" class="action-btn" :disabled="shareList.length === 0" @click="generateShareImage()">
                        <i class="fas fa-image"></i> 生成圖片
                    </button>
                </div>
            </div>
        </aside>

        <main class="content-area">
            <div class="content-header">
                <h2 class="section-title">查詢結果 <span id="resultCount" class="badge" x-text="filteredAnime.length"></span></h2>
                <span class="update-time" x-text="lastUpdateTime"></span>
            </div>

            <div x-show="loading" class="status-box" role="status" aria-live="polite">
                <i class="fas fa-spinner fa-spin"></i> 資料讀取中...
            </div>

            <div x-show="!loading && loadError" class="status-box" role="alert" aria-live="assertive" style="text-align: left;">
                <strong x-text="loadError && loadError.title"></strong>
                <div x-text="loadError && loadError.message" style="margin-top: 8px;"></div>
                <small x-text="loadError ? '錯誤代碼：' + loadError.code : ''" style="display: block; margin-top: 8px; opacity: 0.8;"></small>
                <div x-show="loadError && loadError.hasStaleData" style="margin-top: 8px;">目前保留上次成功的資料；重新載入成功後會自動更新。</div>
                <button type="button" class="btn-add" style="margin-top: 14px;" @click="retryLoad()" :disabled="loading">
                    <i class="fas fa-redo"></i> 重新載入
                </button>
            </div>
            
            <div x-show="!loading && !loadError && filteredAnime.length === 0" class="status-box" style="display: none;">
                沒有符合條件的動畫
            </div>

            <div class="anime-grid" x-show="!loading && (!loadError || (loadError && loadError.hasStaleData))">
                <template x-for="anime in filteredAnime" :key="animeResultKey(anime)">
                    <div class="anime-card">
                        <div class="card-img-wrapper">
                            <img :src="cardImageUrl(anime, 600)"
                                 :srcset="cardImageSrcset(anime)"
                                 sizes="(min-width: 1400px) 340px, (min-width: 1200px) calc((100vw - 410px) / 2), (min-width: 901px) calc(100vw - 390px), calc(100vw - 40px)"
                                 class="card-img"
                                 loading="lazy"
                                 decoding="async"
                                 :alt="anime.anime_name || '動畫封面'">
                        </div>
                        <div class="card-body">
                            <h3 class="anime-title" x-text="anime.anime_name" @click="copyText(anime.anime_name)"></h3>
                            <div class="source-quarters" x-show="sourceQuarterLabel(anime)" x-text="sourceQuarterLabel(anime)"></div>
                            <div class="info-row">
                                <span><i class="fas fa-calendar-alt"></i> <span x-text="broadcastDayLabel(anime)"></span></span>
                                <span><i class="fas fa-clock"></i> <span x-text="anime.premiere_time || '?'"></span></span>
                            </div>
                            <p class="broadcast-note" x-show="broadcastNote(anime)">
                                <span x-text="broadcastNote(anime)"></span>
                                <a :href="broadcastSourceUrl(anime)" target="_blank" rel="noopener noreferrer">播出來源</a>
                            </p>
                            
                            <div class="episode-info">
                                <span class="episode-count" x-text="episodeCountLabel(anime)"></span>
                                <span class="airing-status" x-text="airingStatusLabel(anime)"></span>
                                <span class="episode-warning" x-show="episodeUpdateWarning(anime)" x-text="episodeUpdateWarning(anime)"></span>
                                <details class="episode-details">
                                    <summary>集數來源與確認時間</summary>
                                    <p x-text="episodeMetadataDetail(anime)"></p>
                                    <dl class="source-facts">
                                        <dt>來源方式</dt><dd x-text="episodeSourceKind(anime)"></dd>
                                        <dt>資料狀態</dt><dd x-text="episodeVerificationState(anime)"></dd>
                                        <dt>成功查證</dt><dd x-text="formatSourceTimestamp((anime.episodes && anime.episodes.checked_at))"></dd>
                                        <dt>最近嘗試更新</dt><dd x-text="formatSourceTimestamp((anime.episodes && anime.episodes.attempted_at))"></dd>
                                        <dt x-show="(anime.episodes && anime.episodes.source_snapshot_date)">快照截至</dt><dd x-show="(anime.episodes && anime.episodes.source_snapshot_date)" x-text="(anime.episodes && anime.episodes.source_snapshot_date)"></dd>
                                    </dl>
                                    <p class="source-scope-note">電視版、網路版與特別篇的計數可能不同；以以上範圍說明為準。</p>
                                    <ul class="source-links">
                                        <template x-for="source in episodeSourceLinks(anime)" :key="source.url">
                                            <li><a :href="source.url" target="_blank" rel="noopener noreferrer" x-text="source.label"></a></li>
                                        </template>
                                    </ul>
                                </details>
                            </div>

                            <div class="story-box" :title="anime.story" @click="showStory(anime.anime_name, anime.story)" x-text="anime.story || '暫無簡介'"></div>
                            <a class="story-source" x-show="storySourceUrl(anime)" :href="storySourceUrl(anime)" target="_blank" rel="noopener noreferrer" x-text="storySourceLabel(anime)"></a>
                            
                            <div style="margin-top: auto;">
                                <button class="btn-add mb-2" @click="addToShare(anime)">
                                    <i class="fas fa-plus"></i> 加入清單
                                </button>
                                <a :href="animeSearchUrl(anime.anime_name)"
                                   target="_blank" rel="noopener noreferrer"
                                   class="btn-add" style="border-color: #00cec9; color: #00cec9;">
                                    📺 動畫瘋搜尋
                                </a>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </main>
    </div>

    <button id="backToTopBtn" :class="{ 'show': showBackToTop }" @click="scrollToTop()">
        <i class="fas fa-arrow-up"></i>
    </button>

</div>
{% endblock %}
