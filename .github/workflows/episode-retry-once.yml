name: Retry 73 Episode Failures Once
# Verify redirected subject using the same crawler transport headers.
on:
  push:
    branches: [codex/episode-progress]
    paths: [.github/workflows/episode-retry-once.yml]
permissions:
  contents: read
concurrency:
  group: episode-retry-once-38
  cancel-in-progress: true
jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Retry only stale records and capture public diagnostics
        run: PYTHONPATH=. python scripts/episode_retry_followup_once.py
      - name: Validate reviewable data
        env:
          BUILD_ONLY: 'true'
        run: |
          python generate_static.py
          python manage.py validate-all
          git diff --check
      - name: Upload data and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: episode-retry-${{ github.run_id }}
          path: |
            dist/data
            retry-followup-evidence
          if-no-files-found: error
          retention-days: 7
