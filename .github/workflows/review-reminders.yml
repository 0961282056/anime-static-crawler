name: Daily Review Reminders

on:
  schedule:
    - cron: "0 11 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: anime-source-review-writes
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted reminder code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install locked reminder dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Notify only explicitly dated waiting reviews
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVIEW_ASSIGNEE: ${{ vars.SOURCE_REVIEW_ASSIGNEE || github.repository_owner }}
        run: python manage.py remind-source-reviews
