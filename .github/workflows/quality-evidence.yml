name: Quality Evidence and Trends

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete data history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-canary.txt

      - name: Install locked read-only dependencies
        run: python -m pip install --require-hashes -r requirements-canary.txt

      - name: Rebuild receipts and quality trends without source requests
        run: python manage.py quality-evidence

      - name: Retain reproducible reports and visual trend
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: quality-evidence-${{ github.run_id }}
          path: audit-output/quality/
          retention-days: 90
          if-no-files-found: error
          overwrite: true
