name: Quality Evidence and Trends

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-evidence:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete data history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-canary.txt

      - name: Install locked read-only dependencies
        run: python -m pip install --require-hashes -r requirements-canary.txt

      - name: Rebuild receipts and quality trends without source requests
        run: python manage.py quality-evidence

      - name: Retain reproducible reports and visual trend
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-evidence-${{ github.run_id }}
          path: audit-output/quality/
          retention-days: 90
          if-no-files-found: error
          overwrite: true
