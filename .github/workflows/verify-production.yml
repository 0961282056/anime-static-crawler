name: Verify Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout expected main revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install locked read-only build dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build exact expected static output
        env:
          BUILD_ONLY: "true"
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python generate_static.py
          python manage.py validate-all

      - name: Wait for canonical deployment and compare every data file and asset
        id: production
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python verify_production.py --expected-commit "$EXPECTED_COMMIT" --output audit-output/production.json

      - name: Install browser verification dependencies
        if: steps.production.outputs.status == 'verified'
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify actual production cards and source links
        if: steps.production.outputs.status == 'verified'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if node scripts/verify-production-browser.mjs; then
            exit 0
          fi
          # A newer main can become canonical while the browser is running.
          # Only proven main ancestry may turn this into a superseded result.
          python verify_production.py --expected-commit "$EXPECTED_COMMIT" --output audit-output/production.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('audit-output/production.json').read_text())
          if result['status'] != 'superseded':
              raise SystemExit('Production browser did not pass for the expected release')
          PY

      - name: Save verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-verification-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Summarize deployment verification separately from PR merge
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('audit-output/production.json')
          result = json.loads(path.read_text()) if path.exists() else {'status': 'failed_before_verification'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## 正式站驗收\n\n')
              summary.write(f"- 資料與資產：{result['status']}\n")
              browser = Path('audit-output/production-browser.json')
              summary.write(f"- 正式瀏覽器：{'passed' if browser.exists() else 'not verified'}\n")
              summary.write(f"- 目標 commit：{result.get('expected_commit', 'unavailable')}\n")
              summary.write(f"- 正式 commit：{result.get('deployed_commit', 'unavailable')}\n")
          PY
