name: Verify Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout expected main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install locked read-only build dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build exact expected static output
        env:
          BUILD_ONLY: "true"
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python generate_static.py
          python manage.py validate-all

      - name: Wait for canonical deployment and compare every data file and asset
        id: production
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python verify_production.py --expected-commit "$EXPECTED_COMMIT" --output audit-output/production.json

      - name: Install browser verification dependencies
        if: steps.production.outputs.status == 'verified'
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Verify actual production cards and source links
        if: steps.production.outputs.status == 'verified'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          if node scripts/verify-production-browser.mjs; then
            exit 0
          fi
          # A newer main can become canonical while the browser is running.
          # Only proven main ancestry may turn this into a superseded result.
          python verify_production.py --expected-commit "$EXPECTED_COMMIT" --output audit-output/production.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('audit-output/production.json').read_text())
          if result['status'] != 'superseded':
              raise SystemExit('Production browser did not pass for the expected release')
          PY

      - name: Join release verification and unresolved source refreshes
        if: always()
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          VERIFY_RESULT: ${{ job.status }}
        run: python manage.py production-report

      - name: Save verification evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: production-verification-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Summarize deployment verification separately from PR merge
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('audit-output/delivery.json')
          result = json.loads(path.read_text()) if path.exists() else {'status': 'failed_before_verification'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## 正式站驗收\n\n')
              summary.write(f"- 同一提交整體驗收：{result['status']}\n")
              summary.write(f"- 資料與資產：{result.get('data_status', 'unavailable')}\n")
              summary.write(f"- 正式瀏覽器：{result.get('browser_status', 'unavailable')}\n")
              summary.write(f"- 目標 commit：{result.get('expected_commit', 'unavailable')}\n")
              summary.write(f"- 正式 commit：{result.get('deployed_commit', 'unavailable')}\n")
              pending = result.get('metadata_refresh')
              summary.write(f"- 來源更新待辦：{pending['pending_count'] if pending else 'unavailable'}\n")
          PY

  notify:
    needs: verify
    if: always() && github.ref == 'refs/heads/main' && needs.verify.result != 'skipped'
    runs-on: ubuntu-24.04
    environment: crawler-production
    timeout-minutes: 5
    steps:
      - name: Checkout the verified revision for notification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked notification dependencies
        id: dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Download verification evidence from this run
        id: evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: production-verification-${{ github.run_id }}
          path: audit-output/

      - name: Send final production verification summary
        if: always() && steps.dependencies.outcome == 'success'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERIFY_JOB_RESULT: ${{ needs.verify.result }}
          EVIDENCE_RESULT: ${{ steps.evidence.outcome }}
        run: python manage.py notify-production
