name: Weekly Source Coverage and Cross-check

on:
  schedule:
    - cron: "30 10 * * 1"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-source-audit
  cancel-in-progress: false

jobs:
  source-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-canary.txt

      - name: Install locked read-only dependencies
        run: python -m pip install --require-hashes -r requirements-canary.txt

      - name: Compare all recorded quarters and explicit AniList subjects
        env:
          SOURCE_AUDIT_OUTPUT: audit-output
        run: python manage.py source-audit

      - name: Retain complete report including partial source failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-audit-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
