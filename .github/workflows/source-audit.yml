name: Weekly Source Coverage and Cross-check

on:
  schedule:
    - cron: "30 10 * * 1"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-source-audit
  cancel-in-progress: false

jobs:
  source-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-canary.txt

      - name: Install locked read-only dependencies
        run: python -m pip install --require-hashes -r requirements-canary.txt

      - name: Compare recorded quarters and review official snapshots
        env:
          SOURCE_AUDIT_OUTPUT: audit-output
          SOURCE_AUDIT_ANILIST_ENABLED: "false"
        run: python manage.py source-audit

      - name: Retain complete report including partial source failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: source-audit-${{ github.run_id }}
          path: audit-output/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  notify-reviews:
    concurrency:
      group: anime-source-review-writes
      cancel-in-progress: false
    needs: source-audit
    if: always() && github.ref == 'refs/heads/main' && needs.source-audit.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout trusted notification code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download report from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          digest-mismatch: error
          name: source-audit-${{ github.run_id }}
          path: audit-output

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install locked notification dependencies
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Notify only new or changed review evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVIEW_ASSIGNEE: ${{ vars.SOURCE_REVIEW_ASSIGNEE || github.repository_owner }}
        run: python manage.py notify-source-reviews
