name: Episode Data Backfill Once

on:
  push:
    branches: [codex/episode-progress]
    paths:
      - .github/workflows/episode-backfill-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: episode-backfill-once-38
  cancel-in-progress: false

jobs:
  backfill:
    if: >-
      github.repository == '0961282056/anime-static-crawler' &&
      github.ref == 'refs/heads/codex/episode-progress'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TZ: Asia/Taipei
      REQUEST_TIMEOUT_SECONDS: "8"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout feature snapshot
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Download prior backfill snapshots
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: episode-backfill-38400073362
          run-id: 38400073362
          github-token: ${{ github.token }}
          path: prior-backfill

      - name: Verify prior snapshots and resolve remaining gaps
        run: |
          mkdir -p backfill-evidence
          python - <<'PY'
          import json
          import shutil
          from collections import defaultdict
          from datetime import datetime
          from pathlib import Path
          from models import TAIPEI_TZ, ExternalIds
          from services.data_repository import DataRepository, DataQualityPolicy
          from services.episode_metadata import BangumiClient, EpisodeEnricher, refresh_repository_episodes, _name
          from services.episode_link_lookup import resolve_missing_links

          repo = DataRepository(Path("dist/data"), DataQualityPolicy())
          prior = DataRepository(Path("prior-backfill/dist/data"), DataQualityPolicy())
          basic = ["bangumi_id", "anime_name", "anime_image_url", "premiere_date", "premiere_time", "story"]
          for path in repo.validate_all():
              current = repo.load_path(path)
              incoming = prior.load_path(prior.data_dir / path.name)
              records = []
              for old, new in zip(current.anime_list, incoming.anime_list, strict=True):
                  assert all(getattr(old, key) == getattr(new, key) for key in basic), path.name
                  if old.external_ids.bangumi and new.external_ids.bangumi:
                      assert old.external_ids.bangumi == new.external_ids.bangumi, old.bangumi_id
                  if new.external_ids.bangumi is None and old.external_ids.bangumi:
                      new = new.model_copy(update={"external_ids": old.external_ids, "original_name": new.original_name or old.original_name, "episodes": old.episodes})
                  elif old.episodes and old.episodes.checked_at and (new.episodes is None or new.episodes.checked_at is None):
                      info = old.episodes
                      if new.episodes:
                          info = info.model_copy(update={"attempted_at": new.episodes.attempted_at, "fetch_state": new.episodes.fetch_state, "airing_status": "unknown" if new.episodes.fetch_state == "conflict" else info.airing_status, "note": new.episodes.note})
                      new = new.model_copy(update={"episodes": info})
                  records.append(new)
              year, season = path.stem.split("_")
              repo.write_quarter(year=year, season=season, records=records, source_url=current.source_url, source_count=current.quality.source_count, parse_failure_count=current.quality.parse_failure_count)
          snapshots = Path("prior-backfill/backfill-evidence")
          if snapshots.exists():
              shutil.copytree(snapshots, "backfill-evidence", dirs_exist_ok=True)

          # Existing source card identity plus exact title is stronger than a new search.
          identities = defaultdict(list)
          for path in repo.validate_all():
              for anime in repo.load_path(path).anime_list:
                  if anime.external_ids.bangumi:
                      identities[(anime.bangumi_id, anime.anime_name)].append(anime)
          shared = []
          for path in repo.validate_all():
              ds = repo.load_path(path)
              records = []
              for anime in ds.anime_list:
                  candidates = identities[(anime.bangumi_id, anime.anime_name)]
                  ids = {a.external_ids.bangumi for a in candidates}
                  names = {_name(a.original_name) for a in candidates if a.original_name}
                  if anime.external_ids.bangumi is None and len(ids) == 1 and len(names) <= 1 and (not anime.original_name or not names or _name(anime.original_name) in names):
                      source = next((a for a in candidates if a.episodes and a.episodes.fetch_state == "ok"), candidates[0])
                      changes = {"external_ids": ExternalIds(bangumi=source.external_ids.bangumi, anilist=anime.external_ids.anilist or source.external_ids.anilist), "original_name": anime.original_name or source.original_name}
                      if source.episodes and source.episodes.fetch_state == "ok":
                          changes["episodes"] = source.episodes
                      anime = anime.model_copy(update=changes)
                      shared.append({"quarter": path.stem, "card_id": anime.bangumi_id, "subject_id": anime.external_ids.bangumi})
                  records.append(anime)
              year, season = path.stem.split("_")
              repo.write_quarter(year=year, season=season, records=records, source_url=ds.source_url, source_count=ds.quality.source_count, parse_failure_count=ds.quality.parse_failure_count)
          Path("backfill-evidence/shared-identities.json").write_text(json.dumps(shared, ensure_ascii=False, indent=2), encoding="utf-8")
          verified = []
          for path in sorted(repo.validate_all(), reverse=True):
              year, season = path.stem.split("_")
              client = BangumiClient(request_budget=500)
              matches = resolve_missing_links(repo, client, datetime.now(TAIPEI_TZ), year=year, season=season)
              verified.extend(matches)
              Path("backfill-evidence/verified-links.json").write_text(json.dumps(verified, ensure_ascii=False, indent=2), encoding="utf-8")
              dataset = repo.load_path(path)
              selected = {a.bangumi_id for a in dataset.anime_list if a.external_ids.bangumi and (a.episodes is None or a.episodes.fetch_state != "ok")}
              if selected:
                  client = BangumiClient(request_budget=500)
                  changed = refresh_repository_episodes(repo, datetime.now(TAIPEI_TZ), EpisodeEnricher(client, retry_failed=True), selected_ids=selected)
                  print(path.name, "verified new links", len(matches), "retried", len(selected), "changed", sorted(changed), flush=True)
          counts = {"records": 0, "linked": 0, "ok": 0, "stale": 0, "conflict": 0}
          for path in repo.validate_all():
              for anime in repo.load_path(path).anime_list:
                  counts["records"] += 1
                  counts["linked"] += anime.external_ids.bangumi is not None
                  if anime.episodes:
                      state = anime.episodes.fetch_state
                      counts[state] = counts.get(state, 0) + 1
          Path("backfill-evidence/summary.json").write_text(json.dumps(counts, indent=2), encoding="utf-8")
          print(counts, flush=True)
          PY

      - name: Validate updated data
        env:
          BUILD_ONLY: "true"
          BUILD_VERSION: episode-backfill-review
        run: |
          python generate_static.py
          python manage.py validate-all
          git diff --check

      - name: Upload reviewable data and public source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: episode-backfill-${{ github.run_id }}
          path: |
            dist/data
            backfill-evidence
          if-no-files-found: error
          retention-days: 7
