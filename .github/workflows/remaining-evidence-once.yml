name: Inspect Remaining Episode Evidence Once
on:
  push:
    branches: [codex/episode-progress]
    paths: [.github/workflows/remaining-evidence-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Read public subject and main-episode evidence
        run: PYTHONPATH=. python scripts/inspect_remaining_episode_evidence.py
      - name: Upload public evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: remaining-evidence-${{ github.run_id }}
          path: remaining-evidence
          if-no-files-found: error
          retention-days: 7
