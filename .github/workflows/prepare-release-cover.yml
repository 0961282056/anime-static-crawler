name: Prepare verified release cover

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anime-cloudinary-mutations
  cancel-in-progress: false

jobs:
  prepare-cover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: crawler-production
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Verify exact source and store the missing cover
        env:
          CLOUDINARY_CLOUD_NAME: ${{ vars.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from bs4 import BeautifulSoup
          from services.cache_repository import CacheRepository
          from services.http_client import SafeImageDownloader, SourceClient
          from services.image_store import CloudinaryImageStore
          from services.parser import parse_anime_item
          from services.settings import CrawlerSettings

          expected = "26996d05b15a40edcfb847a325cccb682f93a0742f4512c3ac8134565d6a1694"
          settings = CrawlerSettings.from_environment()
          source_url, html = SourceClient(settings).fetch_quarter_html("2024", "秋")
          cards = BeautifulSoup(html, "lxml").select(
              'div#acgs-anime-list div.acgs-anime-block.CV-search[acgs-bangumi-anime-id="anime-2210"]'
          )
          if len(cards) != 1:
              raise RuntimeError("Expected exactly one reviewed source card")
          original = cards[0].select_one(".entity_original_name")
          if original is None or original.get_text(" ", strip=True) != "クマーバ シーズン2":
              raise RuntimeError("Reviewed original title changed")
          candidate = parse_anime_item(str(cards[0]))
          if candidate.anime_name != "Kumarba 第2季":
              raise RuntimeError("Reviewed localized title changed")

          class VerifiedDownloader:
              def download(self, url):
                  response = SafeImageDownloader(settings).download(url)
                  if hashlib.sha256(response.content).hexdigest() != expected:
                      raise RuntimeError("Reviewed cover content changed")
                  return response

          cache = CacheRepository(Path("prepared-cover-cache.json"))
          store = CloudinaryImageStore(settings, cache, downloader=VerifiedDownloader())
          store.assert_quota_available()
          url = store.store(candidate.source_image_url, candidate.anime_name)
          result = {
              "card_id": "anime-2210",
              "original_name": "クマーバ シーズン2",
              "source_url": source_url,
              "source_image_url": candidate.source_image_url,
              "sha256": expected,
              "cloudinary_url": url,
              "cache_entries": cache.snapshot(),
          }
          Path("prepared-cover.json").write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n")
          print("Verified cover prepared:", url)
          PY
      - name: Save public cover evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release-cover
          path: prepared-cover.json
          retention-days: 7
          if-no-files-found: error
